name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android
          flutter create --platforms=android --org com.daivik --project-name spotiloop .
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Configure App Name, Permissions and Deep Link Intent Filters
        run: python3 tool/configure_android.py

      - name: Generate Custom Brand Launcher Icons
        run: |
          pip install pillow
          python3 -c "
          import os
          from PIL import Image
          
          logo_path = 'assets/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              for folder, size in sizes.items():
                  target_dir = os.path.join('android/app/src/main/res', folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
                  print(f'Generated {folder}/ic_launcher.png ({size}x{size})')
          else:
              print('Warning: assets/logo.png not found!')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Spoti-Loop.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoti-Loop-apk
          path: build/app/outputs/flutter-apk/Spoti-Loop.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Spoti Loop v1.0.0 (Android APK)"
          body: "Official Android APK release for Spoti Loop with custom brand icon, background audio session loop execution, and Spotify OAuth PKCE deep linking. Download `Spoti-Loop.apk` below and install on your phone!"
          files: |
            build/app/outputs/flutter-apk/Spoti-Loop.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
