name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android
          flutter create --platforms=android --org com.daivik --project-name spotiloop .
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Configure App Name and Deep Link Intent Filters
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          # Replace app label with Spoti Loop
          content = content.replace('android:label=\"spotiloop\"', 'android:label=\"Spoti Loop\"')
          
          # Ensure singleTask launch mode so existing app instance receives the deep link callback
          content = content.replace('android:launchMode=\"singleTop\"', 'android:launchMode=\"singleTask\"')

          deep_link = '''
              <!-- Spotify OAuth PKCE Deep Link Callback -->
              <intent-filter>
                  <action android:name=\"android.intent.action.VIEW\"/>
                  <category android:name=\"android.intent.category.DEFAULT\"/>
                  <category android:name=\"android.intent.category.BROWSABLE\"/>
                  <data android:scheme=\"spotiloop\" android:host=\"callback\"/>
                  <data android:scheme=\"spotiloop\"/>
              </intent-filter>
          '''
          if 'android:scheme=\"spotiloop\"' not in content:
              content = content.replace('</activity>', deep_link + '\n        </activity>')
          
          with open(manifest_path, 'w') as f:
              f.write(content)
          
          print('=== VERIFIED ANDROID MANIFEST ===')
          with open(manifest_path, 'r') as f:
              print(f.read())
          "

      - name: Generate Custom Brand Launcher Icons
        run: |
          pip install pillow
          python3 -c "
          import os
          from PIL import Image
          
          logo_path = 'assets/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              for folder, size in sizes.items():
                  target_dir = os.path.join('android/app/src/main/res', folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
                  print(f'Generated {folder}/ic_launcher.png ({size}x{size})')
          else:
              print('Warning: assets/logo.png not found!')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Spoti-Loop.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoti-Loop-apk
          path: build/app/outputs/flutter-apk/Spoti-Loop.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Spoti Loop v1.0.0 (Android APK)"
          body: "Official Android APK release for Spoti Loop with custom brand icon and Spotify OAuth PKCE deep linking. Download `Spoti-Loop.apk` below and install on your phone!"
          files: |
            build/app/outputs/flutter-apk/Spoti-Loop.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
