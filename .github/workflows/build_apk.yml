name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          rm -rf android
          flutter create --platforms=android --org com.daivik --project-name spotiloop .

      - name: Configure App Name and Deep Link Filters
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          # Replace app label with Spoti Loop
          content = content.replace('android:label=\"spotiloop\"', 'android:label=\"Spoti Loop\"')
          
          deep_link = '''
              <!-- Spotify OAuth PKCE Deep Link Callback -->
              <intent-filter>
                  <action android:name=\"android.intent.action.VIEW\"/>
                  <category android:name=\"android.intent.category.DEFAULT\"/>
                  <category android:name=\"android.intent.category.BROWSABLE\"/>
                  <data android:scheme=\"spotiloop\" android:host=\"callback\"/>
                  <data android:scheme=\"spotiloop\"/>
              </intent-filter>
          '''
          if 'spotiloop' not in content:
              content = content.replace('</activity>', deep_link + '\n        </activity>')
          with open(manifest_path, 'w') as f:
              f.write(content)
          "

      - name: Generate Custom Brand Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Android APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotiloop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Spoti Loop v1.0.0 (Android APK)"
          body: "Official Android APK release for Spoti Loop with custom brand icon. Download `app-release.apk` below and install on your phone!"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
